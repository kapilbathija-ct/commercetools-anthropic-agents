line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[format]
quote-style = "double"

[lint.per-file-ignores]
# Copied verbatim from the reference host so it stays diffable against upstream.
"service/sessions.py" = ["E501"]
"service/host.py" = ["E501", "I001"]
"service/memory.py" = ["E501", "I001"]
# Diagnostic scripts: their long lines are print formatting, and wrapping them makes
# the output harder to line up than the source is to read.
"scripts/*.py" = ["E501"]
